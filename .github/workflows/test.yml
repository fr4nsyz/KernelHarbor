name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Download dependencies (analysis)
      working-directory: ./cmd/analysis
      run: go mod download

    - name: Download dependencies (agent)
      working-directory: ./cmd/agent
      run: go mod download

    - name: Run analysis tests
      working-directory: ./cmd/analysis
      run: go test -v -race -coverprofile=coverage-analysis.out ./...

    - name: Run agent tests
      working-directory: ./cmd/agent
      run: go test -v -race -coverprofile=coverage-agent.out ./...

    - name: Upload coverage (analysis)
      uses: actions/upload-artifact@v4
      with:
        name: coverage-analysis
        path: ./cmd/analysis/coverage-analysis.out

    - name: Upload coverage (agent)
      uses: actions/upload-artifact@v4
      with:
        name: coverage-agent
        path: ./cmd/agent/coverage-agent.out
