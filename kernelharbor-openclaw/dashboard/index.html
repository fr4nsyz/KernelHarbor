<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KernelHarbor Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>KernelHarbor</h1>
  <span id="health-status" class="health unknown">checking...</span>
</header>

<main>
  <section id="stats-panel" class="panel">
    <h2>24h Overview</h2>
    <div class="stats-grid" id="stats-grid">
      <div class="stat"><span class="stat-value" id="stat-total">-</span><span class="stat-label">Total</span></div>
      <div class="stat"><span class="stat-value" id="stat-malicious">-</span><span class="stat-label">Malicious</span></div>
      <div class="stat"><span class="stat-value" id="stat-suspicious">-</span><span class="stat-label">Suspicious</span></div>
      <div class="stat"><span class="stat-value" id="stat-confirmed">-</span><span class="stat-label">Confirmed</span></div>
      <div class="stat"><span class="stat-value" id="stat-fp">-</span><span class="stat-label">False +</span></div>
    </div>
  </section>

  <section class="panel">
    <div class="alerts-header">
      <h2>Alerts</h2>
      <div class="alerts-controls">
        <button id="view-toggle" data-view="cards" class="btn btn-sm">Timeline</button>
        <button id="refresh-btn" class="btn btn-sm">Refresh</button>
      </div>
    </div>

    <div class="severity-filters">
      <button class="severity-pill active" data-severity="all">All</button>
      <button class="severity-pill" data-severity="malicious">Malicious</button>
      <button class="severity-pill" data-severity="suspicious">Suspicious</button>
      <button class="severity-pill" data-severity="benign">Benign</button>
    </div>

    <div class="alert-filters">
      <label>Since:
        <select id="filter-since">
          <option value="1h">1 hour</option>
          <option value="6h">6 hours</option>
          <option value="24h" selected>24 hours</option>
          <option value="72h">72 hours</option>
        </select>
      </label>
      <label>Limit:
        <input type="number" id="filter-limit" value="50" min="1" max="500">
      </label>
    </div>

    <div id="alert-list" class="alert-list">
      <div class="loading">Loading alerts...</div>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
