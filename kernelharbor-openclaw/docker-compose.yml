services:
  analysis:
    image: kernelharbor/analysis:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.analysis
    ports:
      - "9090:9090"
      - "8080:8080"
    environment:
      GRPC_ADDRESS: ":9090"
      HTTP_ADDRESS: ":8080"
      PROTOCOL: "both"
      KH_API_KEY: "${KH_API_KEY:-}"
      ES_ADDRESSES: "${ES_ADDRESSES:-http://elasticsearch:9200}"
      LLM_BACKEND: "${KH_LLM_BACKEND:-none}"
      LLM_THRESHOLD: "${LLM_THRESHOLD:-0.6}"
      OLLAMA_ADDRESS: "${OLLAMA_ADDRESS:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kernelharbor

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - kernelharbor
    restart: unless-stopped

  falco:
    image: falcosecurity/falco:latest
    profiles:
      - falco
    privileged: true
    pid: host
    volumes:
      - ./rules/kernelharbor-rules.yaml:/etc/falco/rules.d/kernelharbor-rules.yaml:ro
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - /etc:/host/etc:ro
    command: >
      falco -r /etc/falco/rules.d/kernelharbor-rules.yaml
      -o json_output=true
      -o json_include_output_property=false
      -o http_output.enabled=true
      -o http_output.url=http://falcosidekick:2801/
    depends_on:
      - falcosidekick
    networks:
      - kernelharbor
    restart: unless-stopped

  falcosidekick:
    image: falcosecurity/falcosidekick:latest
    profiles:
      - falco
    ports:
      - "2801:2801"
    environment:
      LISTENPORT: "2801"
      DEBUG: "${FALCOSIDEKICK_DEBUG:-true}"
    # In Docker Compose, events flow: Falco → falcosidekick → logs.
    # For the full pipeline (conversion + analysis), run the OpenClaw plugin
    # alongside, which provides a HMAC signer on port 28079 and webhook receiver on port 28080.
    # Configure falcosidekick to forward through the signer:
    #   WEBHOOK_ADDRESS: "http://host.docker.internal:28079/falco/event"
    # Also set KH_SIGNING_SECRET on the gateway/plugin side to match the signing key.
    depends_on: []
    networks:
      - kernelharbor
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - kernelharbor
    restart: unless-stopped
    profiles:
      - llm

volumes:
  es-data:
  ollama-data:

networks:
  kernelharbor:
